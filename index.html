<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aqua Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* deep-water theme: dark backdrop so the white bubbles pop */
    --ink: #e9f8fb;
    --muted: #93bcc6;
    --card: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.12);
    --orange: #ff8a1f;
    --orange-dark: #c95f08;
    --aqua: #2bb7c9;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(110% 85% at 50% 40%, #1f5566 0%, #113543 50%, #08202a 100%);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 10px; padding: 14px 20px; z-index: 6; position: relative;
  }
  .tools { justify-self: end; }
  /* progress: one ring per dot, filled in each ring's colour as it lands */
  .dots { display: flex; gap: 6px; align-items: center; height: 28px; }
  .dot {
    width: 15px; height: 15px; border-radius: 50%; border: 3px solid rgba(255,255,255,.16);
    transition: border-color .2s;
  }
  .dot.on { border-color: var(--c); animation: dotpop .45s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes dotpop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
  .pill.time .value { min-width: 2.4em; text-align: center; }
  /* settings menu */
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 10px); width: 280px; padding: 8px 16px;
    background: rgba(10, 36, 46, .96); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0,0,0,.4); animation: rise .2s ease-out;
  }
  .menu[hidden] { display: none; }
  .menu-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 0; font-size: 15px; font-weight: 500; color: var(--muted);
  }
  .menu-row + .menu-row { border-top: 1px solid var(--line); }
  .switch {
    width: 46px; height: 28px; border-radius: 999px; border: 0; padding: 0; cursor: pointer; position: relative;
    background: rgba(255,255,255,.18); transition: background .2s;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s;
  }
  .switch[aria-checked="true"] { background: var(--aqua); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; }
  .brand svg { flex: none; }
  .stats { display: flex; gap: 8px; }
  .pill {
    background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 16px; display: flex; gap: 8px; align-items: baseline;
  }
  .pill .label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .pill .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.6em; }
  .pill.bump { animation: bump .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; font-size: 14px; font-weight: 600; color: var(--muted);
    padding: 6px 13px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: #133a47; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .swatches { display: flex; gap: 7px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
  .swatch {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; padding: 0; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0,0,0,.14); transition: transform .15s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    display: grid; place-items: center; cursor: pointer; transition: transform .15s, background .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.18); transform: translateY(-1px); }
  .icon-btn svg { width: 18px; height: 18px; }
  .text-btn {
    height: 38px; padding: 0 14px 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 15px; font-weight: 600;
    transition: background .15s;
  }
  .text-btn:hover, .text-btn[aria-expanded="true"] { background: rgba(255,255,255,.18); }
  .text-btn svg { width: 18px; height: 18px; }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }

  /* ---------- Stage ---------- */
  #stage { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: pointer; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* ---------- Pump buttons ---------- */
  .pumps {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 max(28px, env(safe-area-inset-right)) max(26px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
  }
  .pump {
    pointer-events: auto; touch-action: none; position: relative; border: 0; background: none; cursor: pointer;
    width: 124px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0;
  }
  .pump .well { position: relative; width: 124px; height: 124px; display: grid; place-items: center; }
  .pump svg.gauge { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .track { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 5; }
  .gauge .fill { fill: none; stroke: #6fe6f5; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; }
  .pump .cap {
    width: 92px; height: 92px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffc27a 0%, var(--orange) 45%, #e8700f 100%);
    box-shadow: 0 8px 0 var(--orange-dark), 0 14px 22px rgba(201, 95, 8, .35), inset 0 -4px 8px rgba(0,0,0,.08);
    display: grid; place-items: center; transition: transform .08s, box-shadow .08s;
  }
  /* squishy: squash while held, jelly-bounce on release */
  .pump.down .cap {
    transform: translateY(6px) scale(1.03, .96);
    box-shadow: 0 2px 0 var(--orange-dark), 0 5px 10px rgba(201, 95, 8, .3), inset 0 -2px 6px rgba(0,0,0,.1);
  }
  .pump.boing .cap { animation: jelly .35s ease-out; }
  @keyframes jelly {
    0%   { transform: translateY(6px) scale(1.03, .96); }
    60%  { transform: translateY(-2px) scale(.99, 1.02); }
    100% { transform: none; }
  }
  .pump .key {
    font-size: 30px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.18); line-height: 1;
  }
  .pump .hint { font-size: 14px; font-weight: 500; color: var(--muted); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px;
    background: rgba(6, 24, 32, .45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    transition: opacity .3s;
  }
  .card { --ink: #1f3b44; --muted: #5f7b83; color: var(--ink); }
  .overlay[hidden] { display: none; }

  /* ---------- Landing popups ---------- */
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .pop {
    position: absolute; left: 0; top: 0; font-weight: 700; font-size: 24px; color: #fff;
    text-shadow: 0 2px 8px rgba(31,59,68,.5); animation: pop 1.1s ease-out forwards; white-space: nowrap;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
    18% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
  }
  #win { background: rgba(6, 24, 32, .15); backdrop-filter: none; -webkit-backdrop-filter: none; align-items: start; padding-top: 12vh; }
  .card {
    background: rgba(255,255,255,.94); border-radius: 26px; padding: 28px 28px 24px; max-width: 380px; width: 100%;
    box-shadow: 0 24px 60px rgba(31,59,68,.2), 0 2px 6px rgba(31,59,68,.08); text-align: center;
    animation: rise .35s cubic-bezier(.2, 1.2, .4, 1);
  }
  @keyframes rise { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h1, .card h2 { font-size: 30px; font-weight: 700; line-height: 1.1; text-wrap: balance; }
  .card .lede { margin-top: 8px; color: var(--muted); font-size: 16px; line-height: 1.4; text-wrap: pretty; }
  .keys { display: flex; justify-content: center; gap: 14px; margin: 22px 0 14px; }
  .keys > div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  kbd {
    font: inherit; font-weight: 600; font-size: 18px; color: var(--ink); min-width: 46px; height: 46px; padding: 0 12px;
    display: grid; place-items: center; background: #fff; border-radius: 12px;
    box-shadow: 0 3px 0 #cfd8da, 0 0 0 1px #dfe6e7 inset;
  }
  kbd.orange { background: var(--orange); color: #fff; box-shadow: 0 3px 0 var(--orange-dark); }
  .small { font-size: 14px; color: var(--muted); line-height: 1.45; margin-top: 6px; text-wrap: pretty; }
  .primary {
    margin-top: 20px; width: 100%; border: 0; border-radius: 16px; padding: 14px 18px; cursor: pointer;
    font-size: 18px; font-weight: 600; color: #fff; background: var(--aqua);
    box-shadow: 0 4px 0 #1b8796; transition: transform .08s, box-shadow .08s;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b8796; }
  .result { display: flex; justify-content: center; gap: 28px; margin-top: 18px; }
  .result div { display: flex; flex-direction: column; gap: 2px; }
  .result span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .result b { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .newbest { margin-top: 10px; color: var(--orange-dark); font-weight: 600; }

  /* ---------- Small screens: buttons sit below the toy ---------- */
  /* Desktop with a mouse: you press the toy's own buttons, so the floating ones go away */
  @media (min-width: 761px) and (pointer: fine) {
    .pumps { display: none; }
  }
  @media (max-width: 760px), (max-height: 560px) and (max-width: 900px) {
    header { padding: 10px 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .brand { display: none; }
    .dot { width: 12px; height: 12px; border-width: 2.5px; }
    .dots { gap: 4px; }
    .pumps { position: static; padding-top: 4px; }
    .pump { width: 110px; }
    .pump .well { width: 104px; height: 104px; }
    .pump .cap { width: 78px; height: 78px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="13" fill="#d6f4f7"/>
        <ellipse cx="15" cy="17" rx="8" ry="3.2" fill="none" stroke="#ff8a1f" stroke-width="2.6"/>
        <rect x="14" y="5" width="2.2" height="12" rx="1.1" fill="#ff6fae"/>
        <circle cx="21.5" cy="9" r="1.6" fill="#fff" stroke="#2bb7c9" stroke-width="1"/>
      </svg>
      Aqua Rings
    </div>
    <div class="stats">
      <div class="pill" id="ringPill" role="img" aria-label="0 of 12 rings landed"><span class="dots" id="dots"></span></div>
      <div class="pill time"><span class="value" id="timer">0:00</span></div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Difficulty">
        <button id="modeEasy" aria-pressed="true" title="Rings snap onto pegs and stay put">Easy</button>
        <button id="modeClassic" aria-pressed="false" title="Like the real toy: tighter aim, and rings can float off again">Hard</button>
      </div>
      <button class="icon-btn" id="restartBtn" aria-label="Restart" title="Restart (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="text-btn" id="settingsBtn" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="text-btn-label">Settings</span>
        </button>
        <div class="menu" id="settings" hidden>
          <div class="menu-row">
            <span>Toy color</span>
            <div class="swatches" id="swatches" role="group" aria-label="Toy color"></div>
          </div>
          <div class="menu-row">
            <span>Sound</span>
            <button class="switch" id="soundBtn" role="switch" aria-checked="true" aria-label="Sound"></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="stage">
    <div id="fx" aria-hidden="true"></div>
  </div>

  <div class="pumps">
    <button class="pump" data-side="0" aria-label="Left water jet">
      <span class="well">
        <svg class="gauge" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="fill" cx="50" cy="50" r="46"/></svg>
        <span class="cap"><span class="key">A</span></span>
      </span>
      <span class="hint">Left jet</span>
    </button>
    <button class="pump" data-side="1" aria-label="Right water jet">
      <span class="well">
        <svg class="gauge" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="fill" cx="50" cy="50" r="46"/></svg>
        <span class="cap"><span class="key">L</span></span>
      </span>
      <span class="hint">Right jet</span>
    </button>
  </div>

  <div class="overlay" id="intro">
    <div class="card">
      <h1>Aqua Rings</h1>
      <p class="lede">Pump water to float the rings up, then let them sink onto the pegs.</p>
      <div class="keys">
        <div><kbd class="orange">A</kbd>Left jet</div>
        <div><kbd>Space</kbd>Both</div>
        <div><kbd class="orange">L</kbd>Right jet</div>
      </div>
      <p class="small">Or press the orange buttons on the toy.</p>
      <button class="primary" id="startBtn">Start</button>
    </div>
  </div>

  <div class="overlay" id="win" hidden>
    <div class="card">
      <h2>All rings landed!</h2>
      <div class="result">
        <div><span>Time</span><b id="winTime">0:00</b></div>
        <div><span>Best</span><b id="winBest">0:00</b></div>
      </div>
      <p class="newbest" id="newBest" hidden>New best time</p>
      <button class="primary" id="againBtn">Play again</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =========================================================================
   Tuning
   ========================================================================= */
const TANK = { hw: 2.9, hd: 0.5, floorY: -3.3, top: 3.35, waterY: 3.0 };
const NOZZLES = [ { x: -1.85, dir: 1 }, { x: 1.85, dir: -1 } ];
const FLOOR_SLOPE = 0.48;
const RING_R = 0.27, TUBE = 0.08;
const BALL_R = 0.17;
const PEGS = [
  { x: -1.05, tip: 0.85, len: 1.15 },
  { x: 0.12,  tip: 2.05, len: 1.15 },
  { x: 1.2,   tip: 0.2,  len: 1.15 },
].map(p => ({ ...p, ballY: p.tip - p.len }));
const RING_COUNT = 12;
const RING_COLORS = [0xffd23b, 0xff8a24, 0xe8323c, 0x8fdc45, 0xff6fae, 0x4fb8ff];
const TOY_COLORS = [
  { name: 'Lime', hex: '#7bd84e' },
  { name: 'Bubblegum', hex: '#ff86bd' },
  { name: 'Sky', hex: '#52b8ff' },
  { name: 'Sunny', hex: '#ffcf3d' },
  { name: 'Grape', hex: '#a68cff' },
];

const PHYS = {
  gravity: 1.45,      // sink speed in water
  drag: 1.7,          // linear water drag
  jet: 15,            // jet strength
  jetSlope: 0.12,     // how far the jet leans toward the middle
  spread: 0.65,       // sideways push away from the jet's centre
  angDrag: 2.2,
};
const MODES = {
  easy:    { tol: 0.30, magnet: 1,    lock: true,  minUpright: 0 },
  classic: { tol: 0.21, magnet: 0.2, lock: false, minUpright: 0.4 },
};

/* =========================================================================
   Renderer, scene, camera
   ========================================================================= */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8ecea, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(4, 8, 10);
scene.add(sun);

const toy = new THREE.Group();
scene.add(toy);
const BASE_ROT = { x: 0, y: 0 }; // face the player straight on
toy.rotation.set(BASE_ROT.x, BASE_ROT.y, 0);

/* =========================================================================
   Helpers: canvas textures
   ========================================================================= */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const shadowTex = canvasTex(256, 128, (g, w, h) => {
  const grd = g.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
  grd.addColorStop(0, 'rgba(0,8,12,0.6)');
  grd.addColorStop(0.55, 'rgba(0,8,12,0.25)');
  grd.addColorStop(1, 'rgba(0,8,12,0)');
  g.fillStyle = grd;
  g.scale(1, 0.5); g.translate(0, h / 2);
  g.fillRect(0, -h, w, h * 4);
});
const streakTex = canvasTex(64, 4, (g, w) => {
  const grd = g.createLinearGradient(0, 0, w, 0);
  grd.addColorStop(0, 'rgba(255,255,255,0)');
  grd.addColorStop(0.5, 'rgba(255,255,255,1)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, w, 4);
});

/* =========================================================================
   Toy body
   ========================================================================= */
const plastic = new THREE.MeshPhysicalMaterial({ color: TOY_COLORS[0].hex, roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.3 });
const tankBottom = TANK.floorY - 0.7;
const tankH = TANK.top - tankBottom;

// Top cap
const cap = new THREE.Mesh(new RoundedBoxGeometry(6.55, 0.42, 1.7, 4, 0.12), plastic);
cap.position.y = TANK.top + 0.2;
toy.add(cap);

// Base: like the real toy, the front slopes back so the buttons face up toward you
const BASE = { yb: tankBottom - 1.95, yt: tankBottom + 0.02, zBack: -1.15, zFrontTop: 0.75, zFrontBot: 1.3, foot: 0.25, bevel: 0.13 };
{

// 1) Jet guides: show where each jet's water goes (faint arrows idle, a rushing stream when pumping)
const guides = NOZZLES.map(n => {
  const H = TANK.waterY - TANK.floorY;
  const geo = new THREE.PlaneGeometry(1, 1, 1, 30);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const h = uv.getY(i) * H;
    const axisX = n.x + n.dir * PHYS.jetSlope * h;
    const w = 0.42 + 0.2 * h;
    pos.setXYZ(i, axisX + (uv.getX(i) * 2 - 1) * w * 1.25, TANK.floorY + h, -0.08);
  }
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: { value: 0 }, uP: { value: 0 }, uIdle: { value: 0.2 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv; uniform float uTime, uP, uIdle;
      void main() {
        float x = vUv.x * 2.0 - 1.0;
        float across = exp(-x * x * 3.5);
        float fadeIn = smoothstep(0.0, 0.05, vUv.y);
        // idle: upward chevrons in the lower part of the tank
        float cy = fract(vUv.y * 7.0 - abs(x) * 0.9 - uTime * 0.7);
        float chevron = smoothstep(0.0, 0.08, cy) * (1.0 - smoothstep(0.16, 0.26, cy));
        float idle = uIdle * chevron * exp(-x * x * 6.0) * fadeIn * (1.0 - smoothstep(0.25, 0.55, vUv.y));
        // active: a rushing stream that thins out near the top
        float flow = 0.6 + 0.4 * sin(vUv.y * 16.0 - uTime * 10.0 + x * 2.0);
        float stream = uP * across * fadeIn * flow * (1.0 - 0.75 * smoothstep(0.4, 1.0, vUv.y)) * 0.5;
        vec3 col = mix(vec3(0.05, 0.55, 0.65), vec3(0.92, 1.0, 1.0), clamp(uP * 1.5, 0.0, 1.0));
        gl_FragColor = vec4(col, max(idle, stream));
      }`,
  });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = 2;
  m.frustumCulled = false;
  toy.add(m);

});

   ========================================================================= */
let actx = null, master = null, jetGain = [], jetFilter = [];
let muted = false;
try { muted = localStorage.getItem('aquaRings.muted') === '1'; } catch {}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch { return; }
  master = actx.createGain();
  master.gain.value = muted ? 0 : 0.55;
  master.connect(actx.destination);
  const len = actx.sampleRate * 2;
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  for (let s = 0; s < 2; s++) {
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300; f.Q.value = 2;
    const g = actx.createGain(); g.gain.value = 0;
    const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
    src.connect(f); f.connect(g);
    if (pan) { pan.pan.value = s ? 0.45 : -0.45; g.connect(pan); pan.connect(master); } else g.connect(master);
    src.start();
    jetGain[s] = g; jetFilter[s] = f;
  }
}
function blip(freq, dur, type = 'sine', vol = 0.06, sweep = 2.2, when = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * sweep, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => blip(f, 0.3, 'triangle', 0.08, 1.0, i * 0.09)),
};

  const h = y - TANK.floorY;
  if (h < -0.2 || P <= 0) return null;
  const hh = Math.max(h, 0);
  const axisX = nz.x + nz.dir * PHYS.jetSlope * hh;
  const w = 0.42 + 0.2 * hh;
  const dx = (x - axisX) / w;
  // strong core jet + a wide, softer stir so nearby rings get swept in too
  const core = Math.exp(-dx * dx) / (1 + 0.13 * hh);
  const dw = (x - axisX) / 1.25;
  const stir = 0.3 * Math.exp(-dw * dw) / (1 + 0.35 * hh);
  const f = P * PHYS.jet * (core + stir);
  return [f * (nz.dir * PHYS.jetSlope + PHYS.spread * Math.max(-1.5, Math.min(1.5, dx))), f, dx];
}

function slotY(peg, k) { return peg.ballY + BALL_R * 0.8 + TUBE + k * (2 * TUBE + 0.006); }

function step(dt) {
  const cfg = MODES[mode];
  simTime += dt;

  // Pressure: a quick burst when you press, then a steady stream while held
  for (let s = 0; s < 2; s++) {
    if (held[s].size) {
      heldFor[s] += dt;
      // extra kick at the start so even a quick tap visibly lifts rings
      const target = heldFor[s] < 0.2 ? 1.35 : heldFor[s] < 0.45 ? 1 : 0.78;
      pressure[s] += (target - pressure[s]) * Math.min(1, dt * 14);
    } else {
      heldFor[s] = 0;
      pressure[s] = Math.max(0, pressure[s] - dt * 3.5);
    }
  }

  // Stack slots per peg (sorted by height)
  for (let pi = 0; pi < PEGS.length; pi++) {
    const onPeg = rings.filter(r => r.peg === pi).sort((a, b) => a.p.y - b.p.y);
    onPeg.forEach((r, k) => { r.slot = k; });
  }

  for (const r of rings) {
    r.prevY = r.p.y;
    r.axis.copy(UP).applyQuaternion(r.q);
    const ay = Math.abs(r.axis.y);
    const halfH = TUBE + RING_R * Math.sqrt(Math.max(0, 1 - ay * ay));
    const halfX = TUBE + RING_R * Math.sqrt(Math.max(0, 1 - r.axis.x * r.axis.x));

    // ---- Ring sitting on a peg ----
    if (r.peg >= 0) {
      const peg = PEGS[r.peg];
      r.p.x += (peg.x - r.p.x) * Math.min(1, dt * 14);
      r.p.z += (0 - r.p.z) * Math.min(1, dt * 10);
      let ay2 = -PHYS.gravity * 1.3;
      if (!cfg.lock) {
        for (let s = 0; s < 2; s++) {
          const jf = jetForce(r.p.x, r.p.y, NOZZLES[s], pressure[s]);
          if (jf) ay2 += jf[1] * 0.6;
        }
      }
      r.v.y += ay2 * dt;
      r.v.y *= Math.exp(-PHYS.drag * 1.2 * dt);
      r.v.x = r.v.z = 0;
      r.p.y += r.v.y * dt;
      const floorY = slotY(peg, r.slot);
      if (r.p.y < floorY) { r.p.y = floorY; r.v.y = Math.abs(r.v.y) > 0.4 ? -r.v.y * 0.15 : 0; }
      // settle flat, with a little spin
      r.yaw += r.w.y * dt;
      r.w.multiplyScalar(Math.exp(-3 * dt));
      tmpQ.setFromAxisAngle(UP, r.yaw);
      r.q.slerp(tmpQ, Math.min(1, dt * (cfg.lock ? 7 : 4)));
      if (!cfg.lock && r.p.y > peg.tip + 0.03 && r.v.y > 0) {
        r.peg = -1; // floated off the top
      }
      continue;
    }

    // ---- Free ring ----
    acc.set(0, -PHYS.gravity, -r.p.z * 1.5);
    for (let s = 0; s < 2; s++) {
      const jf = jetForce(r.p.x, r.p.y, NOZZLES[s], pressure[s]);
      if (!jf) continue;
      acc.x += jf[0]; acc.y += jf[1];
      acc.z += (Math.random() - 0.5) * jf[1] * 0.6;
      // tumble
      r.w.z += -jf[2] * jf[1] * 0.7 * dt;
      r.w.x += (Math.random() - 0.5) * jf[1] * 2.5 * dt;
    }
    // near the bottom, the sloped floor funnels rings back toward the nozzles
    if (r.p.y < floorAt(r.p.x) + 0.7) {
      const nz = Math.abs(r.p.x - NOZZLES[0].x) < Math.abs(r.p.x - NOZZLES[1].x) ? NOZZLES[0] : NOZZLES[1];
      const off = r.p.x - nz.x;
      if (Math.abs(off) > 0.08) acc.x -= Math.sign(off) * 1.1;
    }
    // gentle swirl so the water never feels dead
    const swirl = (pressure[0] + pressure[1]) * 0.35;
    acc.x += Math.sin(simTime * 1.7 + r.p.y * 1.3) * swirl;

    // easy-mode "magnet" over each peg
    if (cfg.magnet) {
      for (const peg of PEGS) {
        const dx = r.p.x - peg.x, above = r.p.y - peg.tip;
        if (above > 0 && above < 1.2 && Math.abs(dx) < 0.8 && r.v.y < 0.5) {
          const k = (1 - above / 1.2) * cfg.magnet;
          acc.x += -dx * 9 * k;
          r.v.x *= Math.exp(-3 * k * dt);
          acc.y -= 0.5 * k;
        }
      }
    }

    r.v.addScaledVector(acc, dt);
    r.v.multiplyScalar(Math.exp(-PHYS.drag * dt));
    r.v.z *= Math.exp(-2 * dt);
    r.p.addScaledVector(r.v, dt);

    // rotation: tumble + slowly level out when sinking (like a coin in water)
    const target = r.axis.y >= 0 ? UP : tmpV.set(0, -1, 0);
    tmpAxis.crossVectors(r.axis, target);
    const level = r.v.y < 0 ? 1.6 : 0.5;
    r.w.addScaledVector(tmpAxis, level * dt * (1 + cfg.magnet * 0.6));
    r.w.multiplyScalar(Math.exp(-PHYS.angDrag * dt));
    const wl = r.w.length();
    if (wl > 1e-5) {
      tmpQ.setFromAxisAngle(tmpV.copy(r.w).divideScalar(wl), wl * dt);
      r.q.premultiply(tmpQ).normalize();
    }

    // walls
    const lim = TANK.hw - halfX;
    if (r.p.x > lim) { r.p.x = lim; r.v.x = -Math.abs(r.v.x) * 0.3; }
    if (r.p.x < -lim) { r.p.x = -lim; r.v.x = Math.abs(r.v.x) * 0.3; }
    if (Math.abs(r.p.z) > 0.2) { r.p.z = Math.sign(r.p.z) * 0.2; r.v.z *= -0.3; }
    // water surface
    const ceil = TANK.waterY - halfH * 0.7;
    if (r.p.y > ceil) { r.p.y = ceil; r.v.y = Math.min(r.v.y, 0) - 0.05; }
    // sloped floor
    const fy = floorAt(r.p.x) + halfH;
    if (r.p.y < fy) {
      r.p.y = fy;
      const sl = floorSlope(r.p.x);
      const nx = -sl / Math.hypot(sl, 1), ny = 1 / Math.hypot(sl, 1);
      const vn = r.v.x * nx + r.v.y * ny;
      if (vn < 0) { r.v.x -= nx * vn; r.v.y -= ny * vn; }
      r.v.x *= 0.995;
      r.w.multiplyScalar(0.97);
    }

    // pegs: capture or collide
    for (let pi = 0; pi < PEGS.length; pi++) {
      const peg = PEGS[pi];
      const dx = r.p.x - peg.x, adx = Math.abs(dx);
      if (r.prevY >= peg.tip && r.p.y < peg.tip && adx < cfg.tol && ay >= cfg.minUpright) {
        capture(r, pi);
        break;
      }
      // the stick blocks the rim
      if (r.p.y < peg.tip + halfH * 0.6 && r.p.y > peg.ballY && adx < halfX + 0.035 && !(r.p.y >= peg.tip && adx < cfg.tol)) {
        const sgn = dx === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(dx);
        const push = halfX + 0.035 - adx;
        r.p.x += sgn * push * 0.5;
        r.v.x += sgn * push * 6;
        r.w.z += sgn * push * 4;
      }
      // the ball under the peg
      const bx = r.p.x - peg.x, by = r.p.y - peg.ballY;
      const bd = Math.hypot(bx, by), minD = BALL_R + halfH * 0.6 + 0.05;
      if (bd < minD && bd > 1e-4) {
        const pen = minD - bd;
        r.p.x += (bx / bd) * pen; r.p.y += (by / bd) * pen;
        const vn = (r.v.x * bx + r.v.y * by) / bd;
        if (vn < 0) { r.v.x -= (bx / bd) * vn * 1.3; r.v.y -= (by / bd) * vn * 1.3; }
      }
    }
  }

  // ring vs ring
  const MIN_D = 0.3;
  for (let i = 0; i < rings.length; i++) {
    const a = rings[i];
    for (let j = i + 1; j < rings.length; j++) {
      const b = rings[j];
      if (a.peg >= 0 && a.peg === b.peg) continue;
      tmpV.subVectors(b.p, a.p);
      let d2 = tmpV.lengthSq();
      if (d2 >= MIN_D * MIN_D) continue;
      if (d2 < 1e-8) { tmpV.set(Math.random() - 0.5, 0.2, Math.random() - 0.5); d2 = tmpV.lengthSq(); }
      const d = Math.sqrt(d2);
      const ma = a.peg >= 0 ? 0 : 1, mb = b.peg >= 0 ? 0 : 1;
      if (ma + mb === 0) continue;
      tmpV.divideScalar(d);
      const pen = MIN_D - d, tot = ma + mb;
      a.p.addScaledVector(tmpV, -pen * ma / tot);
      b.p.addScaledVector(tmpV, pen * mb / tot);
      const rel = (b.v.x - a.v.x) * tmpV.x + (b.v.y - a.v.y) * tmpV.y + (b.v.z - a.v.z) * tmpV.z;
      if (rel < 0) {
        const imp = -rel * 0.8 / tot;
        a.v.addScaledVector(tmpV, -imp * ma);
        b.v.addScaledVector(tmpV, imp * mb);
      }
    }
  }

  // bubbles: spawn
  for (let s = 0; s < 2; s++) {
    const P = pressure[s];
    if (P <= 0.02) continue;
    const n = NOZZLES[s];
    const count = P * 170 * dt + Math.random();
    for (let k = 0; k < Math.floor(count); k++) {
      spawnBubble(n.x + (Math.random() - 0.5) * 0.16, TANK.floorY + 0.05, (Math.random() - 0.5) * 0.6,
        n.dir * 0.4 + (Math.random() - 0.5) * 1.2, 2 + Math.random() * 3.5 * P, 0.035 + Math.random() * Math.random() * 0.17);
    }
    if (Math.random() < P * 9 * dt) sfx.bloop();
  }
  if (Math.random() < dt * 1.6) {
    spawnBubble((Math.random() * 2 - 1) * 2.6, floorAt(0) - 0.3, (Math.random() - 0.5) * 0.6, 0, 0.6, 0.03 + Math.random() * 0.05);
  }
}

function capture(r, pi) {
  r.peg = pi;
  r.landedAt = simTime;
  r.v.set(0, Math.min(r.v.y, 0) * 0.5, 0);
  r.w.set(0, (Math.random() - 0.5) * 6, 0);
  r.yaw = Math.random() * 6.28;
  sfx.clink();
  const left = RING_COUNT - landedCount();
  popAt(PEGS[pi].x, PEGS[pi].tip + 0.3, firstLanding ? 'Nice!' : left === 0 ? 'All 12!' : '+1');
  firstLanding = false;
  // boing: the peg wobbles and its ball squashes
  const pr = pegRigs[pi];
  pr.va += (Math.random() < 0.5 ? -1 : 1) * 1.6;
  pr.vsq += 2.2;
  // a splash of bubbles in the ring's own colour
  const col = r.mesh.material.color;
  for (let k = 0; k < 22; k++) {
    const ang = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 1.2;
    spawnBubble(r.p.x, r.p.y, (Math.random() - 0.5) * 0.3,
      Math.cos(ang) * sp, 0.6 + Math.abs(Math.sin(ang)) * sp, 0.04 + Math.random() * 0.07,
      Math.random() < 0.75 ? col : null);
  }
}

function updateBubbles(dt) {
  for (let i = 0; i < MAXB; i++) {
    if (bLife[i] <= 0) { bSize[i] = 0; bAlpha[i] = 0; continue; }
    const ix = i * 3;
    let x = bPos[ix], y = bPos[ix + 1];
    let fx = 0, fy = 2.4;
    for (let s = 0; s < 2; s++) {
      const jf = jetForce(x, y, NOZZLES[s], pressure[s]);
      if (jf) { fx += jf[0] * 0.5; fy += jf[1] * 0.4; }
    }
    bVel[ix] += (fx - bVel[ix] * 2.2) * dt;
    bVel[ix + 1] += (fy - bVel[ix + 1] * 1.6) * dt;
    bPhase[i] += dt * 9;
    x += (bVel[ix] + Math.sin(bPhase[i]) * 0.25) * dt;
    y += bVel[ix + 1] * dt;
    if (x > TANK.hw - 0.05) x = TANK.hw - 0.05;
    if (x < -TANK.hw + 0.05) x = -TANK.hw + 0.05;
    bPos[ix] = x; bPos[ix + 1] = y;
    const fadeIn = Math.min(1, bAlpha[i] + dt * 6);
    if (y > TANK.waterY - 0.02) { bLife[i] -= dt * 10; bPos[ix + 1] = TANK.waterY - 0.02; }
    bLife[i] -= dt * 0.08;
    bAlpha[i] = Math.min(fadeIn, Math.max(0, bLife[i]));
  }
  bGeo.attributes.position.needsUpdate = true;
  bGeo.attributes.aSize.needsUpdate = true;
  bGeo.attributes.aAlpha.needsUpdate = true;
  bGeo.attributes.aColor.needsUpdate = true;
}

function updateSurface() {
  const pos = surfGeo.attributes.position.array;
  const h = TANK.waterY - TANK.floorY;
  const tops = NOZZLES.map(n => n.x + n.dir * PHYS.jetSlope * h);
  for (let i = 0; i < pos.length; i += 3) {
    const x = surfBase[i];
    let y = Math.sin(x * 2.6 + simTime * 1.8) * 0.012 + Math.sin(x * 5.1 - simTime * 2.3) * 0.006;
    for (let s = 0; s < 2; s++) {
      const d = x - tops[s];
      y += pressure[s] * 0.09 * Math.exp(-d * d / 0.35) * (0.8 + 0.2 * Math.sin(simTime * 14 + x * 6));
    }
    pos[i + 1] = y;
  }
  surfGeo.attributes.position.needsUpdate = true;
  surfGeo.computeVertexNormals();
}

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function landedCount() { return rings.filter(r => r.peg >= 0).length; }
function updateHud(force) {
  const landed = rings.filter(r => r.peg >= 0).sort((a, b) => a.landedAt - b.landedAt);
  const key = landed.map(r => rings.indexOf(r)).join(',');
  if (key !== lastDotKey || force) {
    lastDotKey = key;
    lastCount = landed.length;
    dotEls.forEach((d, i) => {
      const r = landed[i];
      const wasOn = d.classList.contains('on');
      if (r) {
        d.style.setProperty('--c', '#' + r.mesh.material.color.getHexString());
        if (!wasOn) d.classList.add('on');

    ringPill.setAttribute('aria-label', `${landed.length} of ${RING_COUNT} rings landed`);
  }
  const t = fmt(elapsed);
  if (t !== lastTimeText) { timerEl.textContent = t; lastTimeText = t; }
  for (let s = 0; s < 2; s++) {
    if (!gaugeFills[s]) continue;
    gaugeFills[s].style.strokeDashoffset = String(289 * (1 - Math.min(1, pressure[s])));
    const isDown = held[s].size > 0;
    if (pumpEls[s].classList.contains('down') && !isDown) {
      pumpEls[s].classList.remove('boing'); void pumpEls[s].offsetWidth; pumpEls[s].classList.add('boing');

}

/* ---------- Landing popups ---------- */
const fxEl = document.getElementById('fx');
let firstLanding = true;
const projV = new THREE.Vector3();
function toScreen(x, y, z) {
  projV.set(x, y, z).applyMatrix4(toy.matrixWorld).project(camera);
  return [(projV.x + 1) / 2 * stage.clientWidth, (1 - projV.y) / 2 * stage.clientHeight];
}
function placeAt(el, x, y, z) {
  const [sx, sy] = toScreen(x, y, z);
  el.style.left = `${sx}px`; el.style.top = `${sy}px`;
}
// popups that land close together stack upward instead of overlapping
const recentPops = [];
function popAt(x, y, text, color) {
  const now = performance.now();
  while (recentPops.length && now - recentPops[0].t > 900) recentPops.shift();
  const [sx, sy] = toScreen(x, y, 0);
  const stack = recentPops.filter(p => Math.abs(p.x - sx) < 90).length;
  recentPops.push({ t: now, x: sx });
  const el = document.createElement('div');
  el.className = 'pop';
  el.textContent = text;
  if (color) el.style.color = color;
  el.style.left = `${sx}px`;
  el.style.top = `${sy - stack * 30}px`;
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 1150);
}
function bestKey() { return `aquaRings.best.${mode}`; }
function checkWin(dt) {
  if (state !== 'play') return;
  const allSettled = rings.every(r => r.peg >= 0 && Math.abs(r.p.y - slotY(PEGS[r.peg], r.slot)) < 0.02);
  winHold = allSettled ? winHold + dt : 0;
  if (winHold > 0.7) {
    state = 'won';
    let best = null;
    try { best = parseFloat(localStorage.getItem(bestKey())); } catch {}
    const isBest = !(best > 0) || elapsed < best;
    if (isBest) { best = elapsed; try { localStorage.setItem(bestKey(), String(elapsed)); } catch {} }
    document.getElementById('winTime').textContent = fmt(elapsed);
    document.getElementById('winBest').textContent = fmt(best);
    document.getElementById('newBest').hidden = !isBest;
    // the landed rings light up one by one, climbing a little scale, then the card appears
    const order = rings.slice().sort((a, b) => a.landedAt - b.landedAt);
    const scale = [523, 587, 659, 784, 880, 1047];
    order.forEach((r, i) => {
      winTimers.push(setTimeout(() => {
        r.glow = 1.4;
        blip(scale[i % scale.length] * (i >= scale.length ? 2 : 1), 0.18, 'triangle', 0.06, 1.0);
        for (let k = 0; k < 6; k++) {
          spawnBubble(r.mesh.position.x, r.mesh.position.y, 0, (Math.random() - 0.5) * 0.8, 0.8 + Math.random(), 0.04 + Math.random() * 0.05, r.mesh.material.color);
        }
      }, 110 * i));
    });
    winTimers.push(setTimeout(() => {
      sfx.win();
      winEl.hidden = false;
      for (let k = 0; k < 120; k++) {
        spawnBubble((Math.random() * 2 - 1) * 2.7, TANK.floorY + Math.random() * 0.5, (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 0.5, 1.5 + Math.random() * 3, 0.04 + Math.random() * 0.1);
      }
    }, 110 * order.length + 350));
  }
}
const winTimers = [];

/* =========================================================================
   Input: left half / right half of the keyboard, screen or buttons
   ========================================================================= */
const LEFT_KEYS = new Set(['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Tab','KeyQ','KeyW','KeyE','KeyR','KeyT',
  'CapsLock','KeyA','KeyS','KeyD','KeyF','KeyG','ShiftLeft','KeyZ','KeyX','KeyC','KeyV','KeyB','ControlLeft','AltLeft','ArrowLeft']);
const RIGHT_KEYS = new Set(['Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','KeyY','KeyU','KeyI','KeyO','KeyP',
  'BracketLeft','BracketRight','Backslash','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Enter','KeyN','KeyM','Comma',
  'Period','Slash','ShiftRight','ControlRight','AltRight','ArrowRight']);

function beginPlay() {
  if (state !== 'intro') return;
  state = 'play';
  introEl.hidden = true;
  initAudio();
}
function press(side, id) {
  if (state === 'intro') beginPlay();
  initAudio();
  if (state === 'won') return;
  held[side].add(id);
  if (timeStart === null && state === 'play') timeStart = performance.now() - elapsed * 1000;
}
function release(id) { held[0].delete(id); held[1].delete(id); }
function releaseAll() { held[0].clear(); held[1].clear(); }

window.addEventListener('keydown', e => {
  if (e.metaKey || (e.ctrlKey && !e.code.startsWith('Control'))) return;
  if (e.code === 'Escape') {
    e.preventDefault();
    if (!settingsEl.hidden) setMenu(false);
    else if (state !== 'intro') restart();
    return;
  }
  if (state === 'won') {
    if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); restart(); }
    return;
  }
  let side = null;
  if (e.code === 'Space') side = 2;
  else if (LEFT_KEYS.has(e.code)) side = 0;
  else if (RIGHT_KEYS.has(e.code)) side = 1;
  if (side === null) return;
  e.preventDefault();
  if (e.repeat) return;
  if (state === 'intro') { beginPlay(); }
  if (side === 2) { press(0, 'k' + e.code); press(1, 'k' + e.code); }
  else press(side, 'k' + e.code);
});
window.addEventListener('keyup', e => release('k' + e.code));
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

// the toy's own orange buttons are clickable; anywhere else, the half of the screen picks the jet
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function buttonAt(e) {
  const rect = stage.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(buttonGroups, true)[0];
  return hit ? buttonGroups.indexOf(hit.object.parent) : -1;
}

pumpEls.forEach(el => {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    press(+el.dataset.side, 'p' + e.pointerId);
  });
  el.addEventListener('click', e => e.preventDefault());
  el.addEventListener('keydown', e => { if (e.code === 'Enter') e.stopPropagation(); });
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => window.addEventListener(t, e => release('p' + e.pointerId), true));
window.addEventListener('contextmenu', e => { if (e.target.closest('#stage, .pump')) e.preventDefault(); });

// hover shows which jet you'd fire
let hoverSide = -1;
stage.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const rect = stage.getBoundingClientRect();
  hoverButton = buttonAt(e);
  hoverSide = hoverButton >= 0 ? hoverButton : e.clientX < rect.left + rect.width / 2 ? 0 : 1;
});
stage.addEventListener('pointerleave', () => { hoverSide = -1; hoverButton = -1; });
pumpEls.forEach(el => {
  el.addEventListener('pointerenter', () => { hoverSide = +el.dataset.side; });
  el.addEventListener('pointerleave', () => { hoverSide = -1; });
});


// Header controls
document.getElementById('startBtn').addEventListener('click', e => { e.currentTarget.blur(); beginPlay(); });
document.getElementById('againBtn').addEventListener('click', e => { e.currentTarget.blur(); restart(); });
document.getElementById('restartBtn').addEventListener('click', e => { e.currentTarget.blur(); restart(); });
soundBtn.addEventListener('click', e => { e.currentTarget.blur(); initAudio(); setMuted(!muted); });
const modeBtns = { easy: document.getElementById('modeEasy'), classic: document.getElementById('modeClassic') };
function setMode(m) {
  mode = m;
  try { localStorage.setItem('aquaRings.mode', m); } catch {}
  modeBtns.easy.setAttribute('aria-pressed', String(m === 'easy'));
  modeBtns.classic.setAttribute('aria-pressed', String(m === 'classic'));
}
Object.entries(modeBtns).forEach(([m, b]) => b.addEventListener('click', e => {
  e.currentTarget.blur();
  if (mode !== m) { setMode(m); restart(); }
}));
const swatchWrap = document.getElementById('swatches');
let toyColor = 0;
try { toyColor = Math.max(0, Math.min(TOY_COLORS.length - 1, +localStorage.getItem('aquaRings.color') || 0)); } catch {}
TOY_COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = c.hex;
  b.title = c.name;
  b.setAttribute('aria-label', `${c.name} toy`);
  b.addEventListener('click', e => { e.currentTarget.blur(); setToyColor(i); });
  swatchWrap.appendChild(b);
});
function setToyColor(i) {
  toyColor = i;
  plastic.color.set(TOY_COLORS[i].hex);
  collarMats.forEach(m => m.color.set(TOY_COLORS[i].hex));
  setLabelInk(TOY_COLORS[i].hex);
  [...swatchWrap.children].forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  try { localStorage.setItem('aquaRings.color', String(i)); } catch {}
}
setToyColor(toyColor);
setMode(mode);
setMuted(muted);

// settings menu: opens from the sliders button, closes on outside click or Esc
const settingsBtn = document.getElementById('settingsBtn');
const settingsEl = document.getElementById('settings');
function setMenu(open) {
  settingsEl.hidden = !open;
  settingsBtn.setAttribute('aria-expanded', String(open));
}
settingsBtn.addEventListener('click', e => { e.currentTarget.blur(); setMenu(settingsEl.hidden); });
document.addEventListener('pointerdown', e => {
  if (!settingsEl.hidden && !e.target.closest('.menu-wrap')) setMenu(false);
}, true);

/* =========================================================================
   Layout + loop
   ========================================================================= */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  // frame the toy tightly, straight on (a hair above centre so flat rings still read)
  const halfH = 5.2, halfW = 3.65, cy = -1.1;
  const dist = Math.max(halfH / t, halfW / (t * camera.aspect)) + 1.2;
  camera.position.set(0, cy + 0.9, dist);
  camera.lookAt(0, cy, 0);
  camera.updateProjectionMatrix();
  bMat.uniforms.uScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * t);
}
new ResizeObserver(resize).observe(stage);
resize();

resetRings();
updateHud(true);

const FIXED = 1 / 120;
let accTime = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  accTime += dt;
  while (accTime >= FIXED) { step(FIXED); accTime -= FIXED; }

  if (state === 'play' && timeStart !== null) elapsed = (now - timeStart) / 1000;
  checkWin(dt);

  updateBubbles(dt);
  updateSurface();

  for (const r of rings) {
    r.mesh.position.copy(r.p);
    r.mesh.quaternion.copy(r.q);
    // win glow fades down to a gentle lit state, otherwise the normal soft glow
    const restGlow = state === 'won' && r.glow > 0 ? 0.45 : 0;
    r.glow += (restGlow - r.glow) * Math.min(1, dt * 2.5);
    r.mesh.material.emissiveIntensity = 0.14 + r.glow;
    if (r.peg >= 0) { // ride along with the peg's wobble
      const a = pegRigs[r.peg].a, h = r.p.y - PEGS[r.peg].ballY;
      r.mesh.position.x -= Math.sin(a) * h;
      r.mesh.position.y -= (1 - Math.cos(a)) * h;
      r.mesh.rotateOnWorldAxis(new THREE.Vector3(0, 0, 1), a);
    }
  }
  for (let s = 0; s < 2; s++) {
    pressVis[s] += ((held[s].size ? 1 : 0) - pressVis[s]) * Math.min(1, dt * 25);
    buttons[s].position.z = 0.22 - pressVis[s] * 0.18;
    engravings[s].position.z = buttons[s].position.z + 0.277;
    // the collar around each button glows with water pressure; the button warms on hover
    collarMats[s].emissiveIntensity = Math.min(1, pressure[s]) * 0.9;
    const hoverTarget = hoverButton === s ? 0.35 : 0;
    btnMats[s].emissiveIntensity += (hoverTarget - btnMats[s].emissiveIntensity) * Math.min(1, dt * 12);
    if (jetGain[s]) {
      jetGain[s].gain.setTargetAtTime(muted ? 0 : pressure[s] * 0.22, actx.currentTime, 0.03);
      jetFilter[s].frequency.setTargetAtTime(250 + pressure[s] * 650, actx.currentTime, 0.05);
    }
  }

  // the toy stays perfectly still; only the water and rings move

  // springy pegs: wobble + ball squash after a ring lands
  pegRigs.forEach(pr => {
    pr.va += (-pr.a * 140 - pr.va * 7) * dt; pr.a += pr.va * dt;
    pr.vsq += (-pr.sq * 260 - pr.vsq * 12) * dt; pr.sq += pr.vsq * dt;
    pr.rig.rotation.z = pr.a;
    pr.ball.scale.set(1 + pr.sq, 1 - pr.sq, 1 + pr.sq);
  });

  // intuitive cues
  const tSec = now / 1000;
  for (let s = 0; s < 2; s++) {
    const g = guides[s].uniforms;
    g.uTime.value = tSec;
    causticMat.uniforms.uTime.value = tSec;
    g.uP.value += (Math.min(1, pressure[s]) - g.uP.value) * Math.min(1, dt * 12);
    const idleTarget = state !== 'play' ? 0.12 : hoverSide === s ? 0.55 : 0.14;
    g.uIdle.value += (idleTarget - g.uIdle.value) * Math.min(1, dt * 8);
  }
  stage.style.cursor = hoverSide >= 0 ? 'pointer' : '';
  targets.forEach((t, i) => {
    const peg = PEGS[i];
    let lined = 0;
    for (const r of rings) {
      if (r.peg >= 0) continue;
      const dx = Math.abs(r.p.x - peg.x), above = r.p.y - peg.tip;
      if (above > -0.05 && above < 1.4 && dx < 0.8) lined = Math.max(lined, (1 - dx / 0.8) * (r.v.y < 0.3 ? 1 : 0.4));
    }
    t.glow += (lined - t.glow) * Math.min(1, dt * 8);
    const show = state === 'won' ? 0 : 1;
    t.m.material.opacity = show * (0.5 + 0.12 * Math.sin(tSec * 2.4 + i) + 0.4 * t.glow);
    t.m.material.color.copy(TARGET_IDLE).lerp(TARGET_HOT, t.glow); // teal, warming to orange when lined up
    t.m.scale.setScalar(1 + 0.18 * t.glow + 0.04 * Math.sin(tSec * 2.4 + i));
    t.m.position.y = peg.tip + 0.2 + 0.04 * Math.sin(tSec * 1.8 + i);
    t.m.position.x = peg.x - Math.sin(pegRigs[i].a) * (peg.len + 0.2);
  });

  updateHud(false);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// expose for debugging in the console
window.__aqua = { rings, PHYS, MODES, PEGS, pressure, held, press, release, restart, step,
  // headless helper: simulate `sec` seconds with jets held per side
  sim(sec, left = false, right = false) {
    if (left) held[0].add('sim'); if (right) held[1].add('sim');
    for (let t = 0; t < sec; t += FIXED) step(FIXED);
    held[0].delete('sim'); held[1].delete('sim');
    return landedCount();
  },
  setMode, };
</script>
</body>
</html>
